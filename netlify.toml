[build]
  publish = "."

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/*.png"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Content-Type = "image/x-icon"

[[redirects]]
  from = "/favicon.ico"
  to = "/images/favicon.png"
  status = 200

[[redirects]]
  from = "/insights/manufacturing-01"
  to = "/manufacturing"
  status = 301
  force = true

[[redirects]]
  from = "/insights/manufacturing-01.html"
  to = "/manufacturing"
  status = 301
  force = true
