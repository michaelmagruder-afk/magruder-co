[build]
  publish = "."

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/*.png"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Content-Type = "image/x-icon"

[[redirects]]
  from = "/favicon.ico"
  to = "/images/favicon.png"
  status = 200

[[redirects]]
  from = "/favicon.svg"
  to = "/images/favicon.svg"
  status = 200

[[redirects]]
  from = "/favicon.png"
  to = "/images/favicon.png"
  status = 200

[[redirects]]
  from = "/friday-to-monday"
  to = "/friday-to-monday.html"
  status = 200

[[redirects]]
  from = "/weekend"
  to = "/friday-to-monday.html"
  status = 200

[[redirects]]
  from = "/plan"
  to = "/friday-to-monday.html"
  status = 200

[[redirects]]
  from = "/insights/context-is-the-next-culture-journal"
  to = "/insights/context-is-the-next-culture#journal"
  status = 301

[[redirects]]
  from = "/brief"
  to = "/insights/context-is-the-next-culture?utm_source=linkedin&utm_medium=social_carousel&utm_campaign=context_culture_q4#brief"
  status = 302

[[redirects]]
  from = "/context"
  to = "/insights/context-is-the-next-culture?utm_source=linkedin&utm_medium=social_carousel&utm_campaign=context_culture_q4#brief"
  status = 302

[[redirects]]
  from = "/position"
