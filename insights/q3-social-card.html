<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&display=swap');
  
  body {
    margin: 0;
    padding: 0;
    background-color: #FAF8F5; /* MCo Cream */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .card {
    width: 1200px;
    height: 630px;
    background-color: #FFFFFF;
    border: 1px solid #D6DDE8;
    box-sizing: border-box;
    padding: 80px 100px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: "Hanken Grotesk", "Helvetica Neue", Helvetica, sans-serif;
  }

  .label {
    color: #F86822; /* MCo Orange */
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 30px;
  }

  .headline {
    color: #131F33; /* MCo Dark Navy */
    font-size: 72px;
    font-weight: 700;
    line-height: 1.1;
    margin: 0 0 30px 0;
    letter-spacing: -1.5px;
  }

  .subhead {
    color: #4A5568;
    font-size: 32px;
    font-weight: 400;
    line-height: 1.4;
    max-width: 900px;
  }

  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .urgent-box {
    background-color: #131F33;
    color: #FFFFFF;
    padding: 24px 40px;
    font-size: 24px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .accent {
    color: #F86822;
  }

  .logo {
    font-weight: 700;
    font-size: 24px;
    color: #131F33;
    letter-spacing: -0.5px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="content-top">
    <div class="label">Executive Threat Advisory</div>
    
    <h1 class="headline">Your board is using AI to<br>decompose your reporting.</h1>
    
    <div class="subhead">
      Submit your Q3 narrative to a 4-node adversarial Conclave.<br>
      We provide the empirical decomposition certificate before you enter the room.
    </div>
  </div>

  <div class="footer-row">
    <div class="urgent-box">
      <span class="accent">SECURE DELIVERY:</span> 24 HOURS (FRI 5:00 PM) OR MON 8:00 AM
    </div>

    <div class="logo">
      Magruder &amp; Company
    </div>
  </div>
</div>

</body>
</html>
